# Pass A: blogPost entry -> blog_post node (no body yet — embeds may not exist).
id: cf_blog
label: 'Test: Contentful blogPost -> blog_post node (Pass A)'
source:
  plugin: contentful_export
  path: 'public://cf-export.json'
  selector: entries
  content_type: blogPost
  locale: en-US
  ids:
    sys_id:
      type: string
process:
  type:
    plugin: default_value
    default_value: blog_post
  title: title
  # Authorship timestamps: sys ISO-8601 -> unix. skip_on_empty front-stop
  # leaves the property unset on dateless rows (Drupal defaults to import
  # time) and keeps strtotime(NULL) out of the pipeline.
  created:
    - plugin: skip_on_empty
      method: process
      source: sys_created_at
    - plugin: callback
      callable: strtotime
  changed:
    - plugin: skip_on_empty
      method: process
      source: sys_updated_at
    - plugin: callback
      callable: strtotime
destination:
  plugin: 'entity:node'
