# Pass A: blogPost entry -> blog_post node (no body yet — embeds may not exist).
id: cf_blog
label: 'Test: Contentful blogPost -> blog_post node (Pass A)'
source:
  plugin: contentful_export
  path: 'public://cf-export.json'
  selector: entries
  content_type: blogPost
  locale: en-US
  ids:
    sys_id:
      type: string
process:
  type:
    plugin: default_value
    default_value: blog_post
  title: title
destination:
  plugin: 'entity:node'
