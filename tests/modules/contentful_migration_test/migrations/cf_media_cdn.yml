# Asset -> image media with NO local_source_dir: every asset with a URL must
# go through the CDN fetch branch (protocol-relative // -> https:
# normalization), and the empty-URL asset must skip its row before any HTTP.
# Exercised by ContentfulAssetMigrationTest with a mocked http_client.
id: cf_media_cdn
label: 'Test: Contentful assets -> image media via CDN fetch'
source:
  plugin: contentful_export
  path: 'public://cf-cdn-export.json'
  selector: assets
  locale: en-US
  ids:
    sys_id:
      type: string
process:
  bundle:
    plugin: contentful_media_bundle
    source: file/contentType
  name: file/fileName
  field_media_image/target_id:
    plugin: contentful_asset_to_media
    source: file/url
    destination: 'public://contentful'
  field_media_image/alt: title
destination:
  plugin: 'entity:media'
