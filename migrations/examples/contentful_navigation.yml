# PATTERN: self-referential type -> Drupal menu, PASS A. Source: 017.
# navigationLink.dropdownLinks is a self-reference (the only cycle in 017).
# Pass A creates every menu_link_content without parent; Pass B attaches parents
# after all links exist. Do not self-lookup parent here: row order is not a
# contract, and unresolved lookups can otherwise create stubs or NULL refs.
id: contentful_navigation
label: 'Contentful navigationLink -> menu links (Pass A: no parent)'
migration_group: contentful
source:
  plugin: contentful_export
  path: 'private://contentful/export.json'
  selector: entries
  content_type: navigationLink
  ids:
    sys_id:
      type: string
process:
  title: label
  menu_name:
    plugin: default_value
    default_value: main
  # link to the target page (entity_reference to node via the page migration)
  'link/uri':
    plugin: contentful_internal_link      # sys.id -> internal:/node/NID via page migrate map
    source: to
destination:
  plugin: 'entity:menu_link_content'
  default_bundle: menu_link_content
migration_dependencies:
  required:
    - contentful_page
# NOTE: siteSettings -> config_singleton; handled by config import, NOT a content migration.
