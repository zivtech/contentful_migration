# PATTERN: self-referential type -> Drupal MENU (resolves the cycle natively). Source: 017.
# navigationLink.dropdownLinks is a self-reference (the only cycle in 017). Modelling it
# as menu_link_content means Drupal's menu hierarchy handles nesting — no break-then-attach
# needed. 'parent' resolves via migration_lookup to THIS migration (allowed: self-ref by id,
# not a graph cycle, because the parent row already exists when the child is processed).
id: contentful_navigation
label: 'Contentful navigationLink -> menu links'
migration_group: contentful
source:
  plugin: contentful_export
  path: 'private://contentful/export.json'
  selector: entries
  content_type: navigationLink
  ids:
    sys_id:
      type: string
process:
  title: label
  menu_name:
    plugin: default_value
    default_value: main
  # link to the target page (entity_reference to node via the page migration)
  'link/uri':
    plugin: contentful_internal_link      # sys.id -> internal:/node/NID via page migrate map
    source: to
  parent:
    plugin: migration_lookup
    migration: contentful_navigation       # self-lookup for dropdown hierarchy
    source: _parent_sys_id                 # set in prepareRow() from the parent's dropdownLinks
destination:
  plugin: 'entity:menu_link_content'
  default_bundle: menu_link_content
migration_dependencies:
  required:
    - contentful_page
# NOTE: siteSettings -> config_singleton; handled by config import, NOT a content migration.
