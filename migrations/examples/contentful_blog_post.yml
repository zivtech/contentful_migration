# PATTERN: two-pass body — PASS A (entities first). Source: synthetic fixture.
# blogPost.body is RichText with has_embeds:true (embedded-asset-block doc1,
# embedded-entry-block callout1, entry-hyperlink post2). The body is NOT set here —
# it can't be, because the embedded entities/assets may not exist yet. Pass B sets it.
id: contentful_blog_post
label: 'Contentful blogPost -> node (Pass A: no body)'
migration_group: contentful
source:
  plugin: contentful_export
  path: 'private://contentful/export.json'
  selector: entries
  content_type: blogPost
  locale: en-US                 # base-language pass
  ids:
    sys_id:
      type: string
process:
  title: title
  'path/alias': slug
  # PATTERN: identity preservation — keep each entry's Contentful id on the
  # entity itself, not only in the migrate map (infrastructure that a
  # migrate:reset erases and JSON:API never exposes). A decoupled consumer can
  # then resolve old Contentful ids forever:
  #   GET /jsonapi/node/blog_post?filter[field_contentful_id]=<sys.id>
  # Create field_contentful_id (plain "Text (plain)" / string, default length)
  # on each destination bundle first. Drop this mapping if you will never need
  # to look entities up by their Contentful id.
  field_contentful_id: sys_id
  # PATTERN: authorship timestamps — sys.createdAt/updatedAt (ISO 8601, present
  # in 209/211 profiled real exports) -> created/changed (unix). Core plugins
  # only. skip_on_empty leaves the property unset on a dateless row, so Drupal
  # defaults it to import time (and strtotime never sees NULL). Use
  # format_date instead of strtotime only if you need TZ normalization.
  created:
    - plugin: skip_on_empty
      method: process
      source: sys_created_at
    - plugin: callback
      callable: strtotime
  changed:
    - plugin: skip_on_empty
      method: process
      source: sys_updated_at
    - plugin: callback
      callable: strtotime
  # PATTERN: author attribution (OPT-IN — uncomment when users.json is staged
  # via `contentful:export --include-users` and contentful_user runs first;
  # then add contentful_user to migration_dependencies.required below).
  # sys.createdBy is a bare User link; the nested key resolves the author's
  # BLOCKED stub through the migrate map. no_stub is load-bearing: the entry
  # pass must never mint users — a DEPARTED member's dangling id would
  # otherwise become an empty stub. Degrades, precisely: a departed member
  # (id not in users.json) falls back to anonymous EXPLICITLY (the
  # default_value tail); an entry with NO createdBy at all skips this
  # pipeline (the lookup skips on empty input), leaving uid unset — Drupal
  # then defaults the owner to the importing user: anonymous under
  # `drush migrate:import`, the logged-in admin under a UI-triggered import.
  # Neither is ever silently uid 1. No-fetch alternative: replace the lookup
  # with static_map on the same source key, mapping known author ids to
  # existing uids.
  # uid:
  #   - plugin: migration_lookup
  #     migration: contentful_user
  #     source: sys_created_by/sys/id
  #     no_stub: true
  #   - plugin: default_value
  #     default_value: 0
  #     strict: true
  field_hero_image:
    plugin: migration_lookup
    migration: contentful_media
    no_stub: true
    source: heroImage/sys/id    # nested key into the raw single Link
  # PATTERN: multi-value paragraph refs (core #2890844). The first
  # skip_on_empty(row) catches malformed links; no_stub prevents Migrate from
  # inventing empty paragraph stubs; the final skip_on_empty(row) drops the
  # one unresolved child inside sub_process before extract can pass NULL into
  # entity_reference_revisions.
  field_sections:
    plugin: sub_process
    source: sections            # raw [{sys:{id}}, …] left by the source plugin
    process:
      ids:                      # migration_lookup on a paragraph returns [id, revision_id]
        - plugin: skip_on_empty
          method: row
          source: sys/id        # nested key into each link element
          message: 'Contentful section reference has no sys.id.'
        - plugin: migration_lookup
          migration: [contentful_hero_section, contentful_callout_card]
          no_stub: true
        - plugin: skip_on_empty
          method: row
          message: 'Referenced Contentful section was not migrated.'
      target_id:
        plugin: extract
        source: '@ids'
        index: [0]
      target_revision_id:
        plugin: extract
        source: '@ids'
        index: [1]
  # body intentionally omitted in Pass A (has_embeds: true) -> set in contentful_blog_post_body
destination:
  plugin: 'entity:node'
  default_bundle: blog_post
migration_dependencies:
  required:
    - contentful_media
    - contentful_hero_section
    - contentful_callout_card
