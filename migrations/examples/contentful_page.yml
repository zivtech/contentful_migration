# PATTERN: node + multi-ref sections + seo->metatag IN-HOST + path alias. Source: 017.
# Top of the (acyclic) page subtree -> migrates after all its section/component children.
id: contentful_page
label: 'Contentful page -> node'
migration_group: contentful
source:
  plugin: contentful_export
  path: 'private://contentful/export.json'
  selector: entries
  content_type: page
  ids:
    sys_id:
      type: string
process:
  title: title
  # slug -> Drupal path alias
  'path/alias':
    plugin: skip_on_empty
    method: process
    source: slug
  # multi-value paragraph reference (core #2890844: migration_lookup + extract).
  # no_stub + skip_on_empty(row) is load-bearing: a missing/cyclic child ref
  # skips this one item inside sub_process instead of creating a stub or
  # passing NULL into entity_reference_revisions.
  field_sections:
    plugin: sub_process
    source: sections                     # raw [{sys:{id}}, …] left by the source plugin
    process:
      ids:
        - plugin: skip_on_empty
          method: row
          source: sys/id
          message: 'Contentful section reference has no sys.id.'
        - plugin: migration_lookup
          migration: [contentful_section_grid, contentful_fifty_fifty, contentful_text_section, contentful_wide_image]
          no_stub: true
        - plugin: skip_on_empty
          method: row
          message: 'Referenced Contentful section was not migrated.'
      target_id:
        plugin: extract
        source: '@ids'
        index: [0]
      target_revision_id:
        plugin: extract
        source: '@ids'
        index: [1]
  # seo component mapped to metatag fields ON THE HOST (no standalone seo migration)
  field_metatags:
    plugin: contentful_seo_to_metatag    # builds the metatag serialized value from the linked seo entry
    source: seo
destination:
  plugin: 'entity:node'
  default_bundle: page
migration_dependencies:
  required:
    - contentful_section_grid
    - contentful_fifty_fifty
    - contentful_text_section
    - contentful_wide_image
